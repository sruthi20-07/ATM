<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ATM Register</title>
    <link rel="stylesheet" th:href="@{/css/atm.css}">
</head>
<body>
<div class="container">
    <h1>📝 Register</h1>
    <div class="message" th:if="${message}" th:text="${message}"></div>
    <div class="error" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/atm/register}" method="post" data-form="register" novalidate>
        <div class="field">
            <input type="text" name="name" placeholder="Full Name" required />
        </div>
        <div class="field">
            <input type="email" name="email" placeholder="Email Address" required />
        </div>
        <div class="field">
            <input type="text" name="phone" placeholder="Phone Number" required />
        </div>
        <div class="field">
            <input type="password" name="password" placeholder="Password" required />
        </div>
        <button type="submit" class="btn" data-loading-text="Creating account…">Register</button>
    </form>

    <div class="link">Already registered? <a th:href="@{/atm/login}">Login here</a></div>
</div>

<script th:src="@{/js/validate.js}"></script>
</body>
</html>
