<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mini Statement</title>
    <link rel="stylesheet" th:href="@{/css/atm.css}">
</head>
<body>
<div class="container">
    <h1>📜 Mini Statement</h1>
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Type</th>
            <th>Amount</th>
            <th>Balance After</th>
            <th>Time</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="txn : ${transactions}">
            <td th:text="${txn.id}"></td>
            <td th:text="${txn.type}"></td>
            <td th:text="${txn.amount}"></td>
            <td th:text="${txn.balanceAfter}"></td>
            <td th:text="${#temporals.format(txn.timestamp, 'dd-MM-yyyy HH:mm')}"></td>
        </tr>
        </tbody>
    </table>
    <a th:href="@{/atm/dashboard}" class="back-btn">⬅ Back to Dashboard</a>
</div>
</body>
</html>
