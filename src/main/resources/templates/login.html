<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ATM Login</title>
    <link rel="stylesheet" th:href="@{/css/atm.css}">
</head>
<body>
<div class="container">
    <h1>🔑 ATM Login</h1>

    <!-- Success banner after logout -->
    <div class="message" th:if="${param.logout}">✅ You have been logged out successfully.</div>

    <!-- Existing error message -->
    <div class="error" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/atm/login}" method="post" data-form="login" novalidate>
        <div class="field">
            <input type="email" name="email" placeholder="Email Address" required />
        </div>
        <div class="field">
            <input type="password" name="password" placeholder="Password" required />
        </div>
        <button type="submit" class="btn" data-loading-text="Signing in…">Login</button>
    </form>

    <div class="link">New user? <a th:href="@{/atm/register}">Register here</a></div>
</div>

<script th:src="@{/js/validate.js}"></script>
</body>
</html>
