<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Deposit</title>
    <link rel="stylesheet" th:href="@{/css/atm.css}">
</head>
<body>
<div class="container">
    <h1>💵 Deposit Money</h1>

    <p th:if="${errorMessage}" class="error" th:text="${errorMessage}"></p>
    <p th:if="${message}" class="message" th:text="${message}"></p>

    <form th:action="@{/atm/deposit}" method="post" data-form="deposit" novalidate>
        <div class="otp-banner" hidden>
            For <b class="otp-amt"></b>, OTP will be required. Please check your registered email after submission.
        </div>
        <div class="field">
            <input type="number" name="amount" step="0.01" min="1" inputmode="decimal" placeholder="Enter Amount" required />
            <!-- live INR preview + hint will appear here -->
        </div>
        <button type="submit" class="btn" data-loading-text="Submitting…">Submit</button>
    </form>

    <!-- OTP confirm modal for > ₹10,000 -->
    <div id="otpConfirmModal" class="modal" aria-hidden="true">
        <div class="panel">
            <h3>OTP Confirmation</h3>
            <p>Transactions above ₹10,000 require OTP verification.</p>
            <p>Amount: <b id="otpConfirmAmount"></b></p>
            <div class="actions">
                <button type="button" class="btn back-btn" id="otpConfirmCancel">Cancel</button>
                <button type="button" class="btn" id="otpConfirmYes">Proceed</button>
            </div>
        </div>
    </div>

    <a th:href="@{/atm/dashboard}" class="back-btn">⬅ Back to Dashboard</a>
</div>

<script th:src="@{/js/validate.js}"></script>
</body>
</html>
